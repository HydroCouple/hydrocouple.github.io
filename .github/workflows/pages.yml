name: HydroCouple site and OpenSWMM workbench
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hydrocouple-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: website
      - uses: actions/checkout@v4
        with:
          repository: HydroCouple/Meshkit
          ref: 45cc2799106c0d57abc0a62470ec25775bc5a036
          path: mesh
      - uses: actions/checkout@v4
        with:
          repository: HydroCouple/openswmm.engine.wasm
          ref: b275beceb24b0cff32c4cde67f73155e0dcb6565
          submodules: recursive
          path: engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile TypeScript wrappers and ship the catalog defaults
        working-directory: engine
        run: npm ci && npm run build
      - name: Build Qt-free mesh and scalar and SIMD solver runtimes
        run: |
          docker run --rm -e HOME=/tmp -v "$PWD:/src" -w /src emscripten/emsdk:6.0.9 bash -ec '
            cd mesh/wasm && npm run build && npm test
            cd /src/engine
            emcmake cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build --target openswmm_wasm --parallel 2
            mkdir -p /src/scalar
            cp dist/openswmm_engine.{js,wasm} /src/scalar/
            emcmake cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-msimd128 -DCMAKE_CXX_FLAGS=-msimd128
            cmake --build build --target openswmm_wasm --parallel 2
            mkdir -p /src/simd
            cp dist/openswmm_engine.{js,wasm} /src/simd/
            emcmake cmake -S . -B build-threads -DCMAKE_BUILD_TYPE=Release -DOPENSWMM_WASM_THREADS=ON -DOPENSWMM_WASM_WEBGPU=ON -DCMAKE_C_FLAGS=-msimd128 -DCMAKE_CXX_FLAGS=-msimd128
            cmake --build build-threads --target openswmm_wasm --parallel 2
            mkdir -p /src/threads
            cp dist/openswmm_engine.{js,wasm} /src/threads/
            cp /src/scalar/* dist/
          '
      - name: Assemble and test the self-contained app
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ vars.MAPBOX_PUBLIC_TOKEN }}
        run: |
          npm pack jszip@3.10.2 proj4@2.23.0 epsg-index@2.0.0 --ignore-scripts
          mkdir zip proj4 epsg && tar xzf jszip-3.10.2.tgz -C zip && tar xzf proj4-2.23.0.tgz -C proj4 && tar xzf epsg-index-2.0.0.tgz -C epsg
          node website/openswmm/prepare.mjs --engine engine --mesh mesh --jszip zip/package --proj4 proj4/package --epsg epsg/package --simd simd --threads threads
          node --test website/openswmm/tests/model.test.mjs website/openswmm/tests/records.test.mjs website/openswmm/tests/crs.test.mjs
          npm install --prefix website/openswmm/tests --no-save --package-lock=false playwright@1.55.0
          website/openswmm/tests/node_modules/.bin/playwright install --with-deps chromium
          node website/openswmm/tests/serve.mjs > /tmp/http.log 2>&1 &
          node website/openswmm/tests/browser.mjs
      - name: Stage existing website and the app
        run: |
          mkdir public
          git -C website archive HEAD | tar xf - -C public
          cp -R website/openswmm/vendor website/openswmm/config.json website/openswmm/offline-files.json public/openswmm/
          rm -r public/.github public/openswmm/tests
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
