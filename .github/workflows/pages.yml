name: Publish the site
# The site is static: Pages publishes the repository as committed. These jobs only write the public
# Mapbox token (repository secret MAPBOX_TOKEN) into the SWMM2D workbench's config.json and deploy.
# Nothing is built or tested here.
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # Packaged in its own job: deploy-pages can look the artifact up before an upload made in its
  # own job is listed ("No artifacts named github-pages").
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write the public Mapbox token
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: node .github/scripts/mapbox-token.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
