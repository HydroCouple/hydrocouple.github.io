<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 435" role="img" aria-labelledby="derivative-chain-title derivative-chain-desc" font-family="system-ui,-apple-system,Segoe UI,sans-serif"><title id="derivative-chain-title">Forward and reverse derivatives across coupled models</title><desc id="derivative-chain-desc">Model A, adapter M and model B form a cascade with composite Jacobian J_B times J_M times J_A. Tangent perturbations travel forward. Cotangents of an objective travel backward through transposed Jacobians. The adapter derivative is part of the chain.</desc><defs><marker id="derivative-chain-arrow-0071bf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0071bf"/></marker><marker id="derivative-chain-arrow-087f8c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="derivative-chain-arrow-b66115" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b66115"/></marker></defs><rect width="1120" height="435" fill="#ffffff"/><text x="32" y="34" font-size="25" fill="#0a1c2e" text-anchor="start" font-weight="700" >The chain rule crosses the connection</text><rect x="32" y="114" width="255" height="139" rx="16" fill="#ffffff" stroke="#d7e5f0" stroke-width="2"/><text x="159.5" y="153" font-size="23" fill="#0a1c2e" text-anchor="middle" font-weight="700" >Model A</text><text x="159.5" y="191" font-size="24" fill="#35516b" text-anchor="middle" font-weight="400" >a = f(x)</text><text x="159.5" y="225" font-size="17" fill="#35516b" text-anchor="middle" font-weight="400" >local derivative J_A</text><rect x="432" y="114" width="255" height="139" rx="16" fill="#ffffff" stroke="#d7e5f0" stroke-width="2"/><text x="559.5" y="153" font-size="23" fill="#0a1c2e" text-anchor="middle" font-weight="700" >Adapter M</text><text x="559.5" y="191" font-size="24" fill="#35516b" text-anchor="middle" font-weight="400" >b = m(a)</text><text x="559.5" y="225" font-size="17" fill="#35516b" text-anchor="middle" font-weight="400" >local derivative J_M</text><rect x="832" y="114" width="255" height="139" rx="16" fill="#ffffff" stroke="#d7e5f0" stroke-width="2"/><text x="959.5" y="153" font-size="23" fill="#0a1c2e" text-anchor="middle" font-weight="700" >Model B</text><text x="959.5" y="191" font-size="24" fill="#35516b" text-anchor="middle" font-weight="400" >y = g(b)</text><text x="959.5" y="225" font-size="17" fill="#35516b" text-anchor="middle" font-weight="400" >local derivative J_B</text><text x="32" y="83" font-size="18" fill="#0071bf" text-anchor="start" font-weight="650" >FORWARD  ·  values and tangent perturbations</text><path d="M287,155 L428,155" fill="none" stroke="#0071bf" stroke-width="3" marker-end="url(#derivative-chain-arrow-0071bf)" /><path d="M687,155 L828,155" fill="none" stroke="#0071bf" stroke-width="3" marker-end="url(#derivative-chain-arrow-0071bf)" /><text x="357" y="141" font-size="20" fill="#0071bf" text-anchor="middle" font-weight="400" >a, δa</text><text x="757" y="141" font-size="20" fill="#0071bf" text-anchor="middle" font-weight="400" >b, δb</text><text x="32" y="309" font-size="18" fill="#b66115" text-anchor="start" font-weight="650" >REVERSE  ·  objective cotangents</text><path d="M832,282 L687,282" fill="none" stroke="#b66115" stroke-width="3" marker-end="url(#derivative-chain-arrow-b66115)" /><path d="M432,282 L287,282" fill="none" stroke="#b66115" stroke-width="3" marker-end="url(#derivative-chain-arrow-b66115)" /><text x="757" y="317" font-size="20" fill="#b66115" text-anchor="middle" font-weight="400" >J_Bᵀ λ</text><text x="357" y="317" font-size="20" fill="#b66115" text-anchor="middle" font-weight="400" >J_Mᵀ J_Bᵀ λ</text><rect x="32" y="345" width="1055" height="61" rx="16" fill="#eef5fb" stroke="#d7e5f0" stroke-width="2"/><text x="559" y="383" font-size="21" fill="#0a1c2e" text-anchor="middle" font-weight="600" >Composite Jacobian:  J = J_B J_M J_A     ·     Each link contributes its own derivative.</text></svg>