<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="digital-twin-assimilation-title digital-twin-assimilation-desc" font-family="system-ui,-apple-system,Segoe UI,sans-serif"><title id="digital-twin-assimilation-title">Variational data assimilation for a water-system digital twin</title><desc id="digital-twin-assimilation-desc">Rainfall drives a coupled model trajectory. An observation operator maps model states to measured water levels and flows at sensor locations and times. The objective combines a background-state prior and observation misfit, weighted by their error covariances. Reverse derivative products pass through the observation operator, adapters, models and previous time steps to an optimizer that updates initial state and optionally parameters. Reintegrating produces the analysis state for a new forecast and control-scenario evaluation. The cycle repeats as observations arrive. This is a conceptual application, not an implemented operational assimilation service.</desc><defs><marker id="digital-twin-assimilation-arrow-0071bf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0071bf"/></marker><marker id="digital-twin-assimilation-arrow-087f8c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="digital-twin-assimilation-arrow-b66115" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b66115"/></marker></defs><rect width="1120" height="700" fill="#ffffff"/><text x="32" y="34" font-size="25" fill="#0a1c2e" text-anchor="start" font-weight="700" >Data assimilation keeps a digital twin connected to the water system</text><rect x="32" y="65" width="1056" height="102" rx="16" fill="#edf8f8" stroke="#c6e3e5" stroke-width="2"/><text x="55" y="100" font-size="23" fill="#087f8c" text-anchor="start" font-weight="700" >Physical system</text><text x="55" y="133" font-size="18" fill="#35516b" text-anchor="start" font-weight="400" >Catchment · storage · receiving water</text><text x="1059" y="101" font-size="20" fill="#087f8c" text-anchor="end" font-weight="600" >Rainfall forcing + level / flow observations</text><text x="1059" y="133" font-size="16" fill="#35516b" text-anchor="end" font-weight="400" >Timestamped measurements with observation-error estimates</text><path d="M159,168 L159,229" fill="none" stroke="#0071bf" stroke-width="3" marker-end="url(#digital-twin-assimilation-arrow-0071bf)" /><text x="183" y="205" font-size="17" fill="#0071bf" text-anchor="start" font-weight="400" >rainfall</text><path d="M960,168 L960,229" fill="none" stroke="#0071bf" stroke-width="3" marker-end="url(#digital-twin-assimilation-arrow-0071bf)" /><text x="935" y="205" font-size="17" fill="#0071bf" text-anchor="end" font-weight="400" >observations</text><rect x="32" y="233" width="254" height="160" rx="16" fill="#ffffff" stroke="#d7e5f0" stroke-width="2"/><text x="159.0" y="271" font-size="20" fill="#0a1c2e" text-anchor="middle" font-weight="700" >Coupled trajectory</text><rect x="423" y="233" width="274" height="160" rx="16" fill="#ffffff" stroke="#d7e5f0" stroke-width="2"/><text x="560.0" y="271" font-size="20" fill="#0a1c2e" text-anchor="middle" font-weight="700" >Observation operator</text><rect x="833" y="233" width="254" height="160" rx="16" fill="#ffffff" stroke="#d7e5f0" stroke-width="2"/><text x="960.0" y="271" font-size="20" fill="#0a1c2e" text-anchor="middle" font-weight="700" >Assimilation objective</text><text x="159" y="310" font-size="23" fill="#35516b" text-anchor="middle" font-weight="400" >x₀ → x₁ → … → xₜ</text><text x="159" y="344" font-size="17" fill="#087f8c" text-anchor="middle" font-weight="400" >runoff → storage → river</text><text x="159" y="373" font-size="16" fill="#35516b" text-anchor="middle" font-weight="400" >models + adapters + memory</text><text x="560" y="311" font-size="26" fill="#35516b" text-anchor="middle" font-weight="400" >ŷₜ = Hₜ(xₜ)</text><text x="560" y="344" font-size="16" fill="#087f8c" text-anchor="middle" font-weight="400" >level / flow at sensor locations</text><text x="560" y="373" font-size="16" fill="#35516b" text-anchor="middle" font-weight="400" >match quantity, place and time</text><text x="960" y="311" font-size="22" fill="#35516b" text-anchor="middle" font-weight="400" >L = prior + misfit</text><text x="960" y="344" font-size="16" fill="#087f8c" text-anchor="middle" font-weight="400" >background and observations</text><text x="960" y="373" font-size="16" fill="#35516b" text-anchor="middle" font-weight="400" >weighted by error covariances</text><path d="M286,317 L419,317" fill="none" stroke="#0071bf" stroke-width="3" marker-end="url(#digital-twin-assimilation-arrow-0071bf)" /><path d="M697,317 L829,317" fill="none" stroke="#0071bf" stroke-width="3" marker-end="url(#digital-twin-assimilation-arrow-0071bf)" /><path d="M833,429 L701,429" fill="none" stroke="#b66115" stroke-width="3" marker-end="url(#digital-twin-assimilation-arrow-b66115)" /><path d="M423,429 L290,429" fill="none" stroke="#b66115" stroke-width="3" marker-end="url(#digital-twin-assimilation-arrow-b66115)" /><text x="763" y="453" font-size="20" fill="#b66115" text-anchor="middle" font-weight="400" >∇ŷ L</text><text x="357" y="453" font-size="17" fill="#b66115" text-anchor="middle" font-weight="400" >VJP of Hₜ</text><path d="M159,429 L159,500" fill="none" stroke="#b66115" stroke-width="3" marker-end="url(#digital-twin-assimilation-arrow-b66115)" /><text x="616" y="490" font-size="18" fill="#b66115" text-anchor="middle" font-weight="400" >VJPs continue through adapters and earlier time steps</text><rect x="32" y="505" width="486" height="116" rx="16" fill="#fff7ed" stroke="#ead1b8" stroke-width="2"/><text x="56" y="540" font-size="21" fill="#b66115" text-anchor="start" font-weight="700" >Assimilate → produce the analysis</text><text x="56" y="572" font-size="17" fill="#35516b" text-anchor="start" font-weight="400" >Optimize initial state x₀ (and optional parameters θ)</text><text x="56" y="601" font-size="17" fill="#35516b" text-anchor="start" font-weight="400" >Reintegrate to obtain the updated current state</text><rect x="672" y="505" width="415" height="116" rx="16" fill="#eef5fb" stroke="#d7e5f0" stroke-width="2"/><text x="697" y="540" font-size="21" fill="#0071bf" text-anchor="start" font-weight="700" >Forecast → support decisions</text><text x="697" y="572" font-size="17" fill="#35516b" text-anchor="start" font-weight="400" >Flood risk · storage availability · outflow</text><text x="697" y="601" font-size="17" fill="#35516b" text-anchor="start" font-weight="400" >Evaluate gate / pump control scenarios</text><path d="M518,562 L668,562" fill="none" stroke="#0071bf" stroke-width="3" marker-end="url(#digital-twin-assimilation-arrow-0071bf)" /><text x="592" y="547" font-size="16" fill="#0071bf" text-anchor="middle" font-weight="400" >analysis</text><text x="560" y="665" font-size="18" fill="#35516b" text-anchor="middle" font-weight="400" >Repeat with each observation window · conceptual variational assimilation workflow</text></svg>