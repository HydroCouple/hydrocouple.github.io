<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 395" role="img" aria-labelledby="state-replay-title state-replay-desc" font-family="system-ui,-apple-system,Segoe UI,sans-serif"><title id="state-replay-title">Checkpointing and derivative propagation through time</title><desc id="state-replay-desc">A sequence of three steps carries both component and adapter state. A checkpoint is saved before each step. Reverse differentiation restores and replays the relevant earlier step before evaluating its vector-Jacobian product and propagating the state cotangent to the preceding step.</desc><defs><marker id="state-replay-arrow-0071bf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0071bf"/></marker><marker id="state-replay-arrow-087f8c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="state-replay-arrow-b66115" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b66115"/></marker></defs><rect width="1120" height="395" fill="#ffffff"/><text x="32" y="34" font-size="25" fill="#0a1c2e" text-anchor="start" font-weight="700" >Memory is part of the derivative</text><rect x="32" y="79" width="286" height="137" rx="16" fill="#ffffff" stroke="#d7e5f0" stroke-width="2"/><text x="175" y="110" font-size="21" fill="#0a1c2e" text-anchor="middle" font-weight="700" >Step 1</text><text x="175" y="149" font-size="18" fill="#35516b" text-anchor="middle" font-weight="400" >(state 0, input) → state 1</text><text x="175" y="184" font-size="16" fill="#087f8c" text-anchor="middle" font-weight="400" >component + adapter state</text><rect x="64" y="251" width="222" height="48" rx="8" fill="#fdf0dc" stroke="#ead1b8" stroke-width="2"/><text x="175" y="282" font-size="16" fill="#b66115" text-anchor="middle" font-weight="400" >Checkpoint before step 1</text><path d="M175,216 L175,247" fill="none" stroke="#b66115" stroke-width="3" marker-end="url(#state-replay-arrow-b66115)" stroke-dasharray="7 6" /><rect x="417" y="79" width="286" height="137" rx="16" fill="#ffffff" stroke="#d7e5f0" stroke-width="2"/><text x="560" y="110" font-size="21" fill="#0a1c2e" text-anchor="middle" font-weight="700" >Step 2</text><text x="560" y="149" font-size="18" fill="#35516b" text-anchor="middle" font-weight="400" >(state 1, input) → state 2</text><text x="560" y="184" font-size="16" fill="#087f8c" text-anchor="middle" font-weight="400" >component + adapter state</text><rect x="449" y="251" width="222" height="48" rx="8" fill="#fdf0dc" stroke="#ead1b8" stroke-width="2"/><text x="560" y="282" font-size="16" fill="#b66115" text-anchor="middle" font-weight="400" >Checkpoint before step 2</text><path d="M560,216 L560,247" fill="none" stroke="#b66115" stroke-width="3" marker-end="url(#state-replay-arrow-b66115)" stroke-dasharray="7 6" /><rect x="802" y="79" width="286" height="137" rx="16" fill="#ffffff" stroke="#d7e5f0" stroke-width="2"/><text x="945" y="110" font-size="21" fill="#0a1c2e" text-anchor="middle" font-weight="700" >Step 3</text><text x="945" y="149" font-size="18" fill="#35516b" text-anchor="middle" font-weight="400" >(state 2, input) → state 3</text><text x="945" y="184" font-size="16" fill="#087f8c" text-anchor="middle" font-weight="400" >component + adapter state</text><rect x="834" y="251" width="222" height="48" rx="8" fill="#fdf0dc" stroke="#ead1b8" stroke-width="2"/><text x="945" y="282" font-size="16" fill="#b66115" text-anchor="middle" font-weight="400" >Checkpoint before step 3</text><path d="M945,216 L945,247" fill="none" stroke="#b66115" stroke-width="3" marker-end="url(#state-replay-arrow-b66115)" stroke-dasharray="7 6" /><path d="M318,142 L413,142" fill="none" stroke="#0071bf" stroke-width="3" marker-end="url(#state-replay-arrow-0071bf)" /><path d="M703,142 L798,142" fill="none" stroke="#0071bf" stroke-width="3" marker-end="url(#state-replay-arrow-0071bf)" /><path d="M802,328 L705,328" fill="none" stroke="#b66115" stroke-width="3" marker-end="url(#state-replay-arrow-b66115)" /><path d="M417,328 L320,328" fill="none" stroke="#b66115" stroke-width="3" marker-end="url(#state-replay-arrow-b66115)" /><text x="560" y="364" font-size="18" fill="#35516b" text-anchor="middle" font-weight="400" >Restore → replay the earlier step → evaluate its VJP → carry the state cotangent backward</text></svg>