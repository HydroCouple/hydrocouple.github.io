<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" role="img" aria-labelledby="coupling-contract-title coupling-contract-desc" font-family="system-ui,-apple-system,Segoe UI,sans-serif"><title id="coupling-contract-title">Model coupling with declared data semantics</title><desc id="coupling-contract-desc">A runoff output passes through an adapted output into a receiving-water input. Quantity, units, geometry and time describe the exchange. The models retain their own equations and state.</desc><defs><marker id="coupling-contract-arrow-0071bf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0071bf"/></marker><marker id="coupling-contract-arrow-087f8c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/></marker><marker id="coupling-contract-arrow-b66115" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b66115"/></marker></defs><rect width="1120" height="380" fill="#ffffff"/><text x="32" y="34" font-size="25" fill="#0a1c2e" text-anchor="start" font-weight="700" >A connection carries more than a number</text><rect x="32" y="72" width="285" height="235" rx="16" fill="#ffffff" stroke="#d7e5f0" stroke-width="2"/><rect x="392" y="100" width="336" height="180" rx="16" fill="#eef5fb" stroke="#d7e5f0" stroke-width="2"/><rect x="803" y="72" width="285" height="235" rx="16" fill="#ffffff" stroke="#d7e5f0" stroke-width="2"/><text x="55" y="106" font-size="23" fill="#0a1c2e" text-anchor="start" font-weight="700" >Runoff component</text><text x="55" y="134" font-size="17" fill="#35516b" text-anchor="start" font-weight="400" >Own equations · own state</text><path d="M58,221 L101,201 L139,218 L183,174 L223,186 L280,153" stroke="#0071bf" stroke-width="4" fill="none"/><text x="55" y="275" font-size="18" fill="#0071bf" text-anchor="start" font-weight="600" >OUTPUT  ·  discharge</text><text x="826" y="106" font-size="21" fill="#0a1c2e" text-anchor="start" font-weight="700" >Receiving-water model</text><text x="826" y="134" font-size="17" fill="#35516b" text-anchor="start" font-weight="400" >Own equations · own state</text><path d="M828,218 Q866,189 902,214 T975,209 T1063,202" stroke="#087f8c" stroke-width="4" fill="none"/><text x="826" y="275" font-size="18" fill="#087f8c" text-anchor="start" font-weight="600" >INPUT  ·  boundary inflow</text><text x="560" y="134" font-size="22" fill="#0a1c2e" text-anchor="middle" font-weight="700" >Adapted output</text><text x="560" y="162" font-size="17" fill="#35516b" text-anchor="middle" font-weight="400" >Map space · align time · convert units</text><path d="M317,210 L387,210" fill="none" stroke="#0071bf" stroke-width="3" marker-end="url(#coupling-contract-arrow-0071bf)" /><path d="M729,210 L799,210" fill="none" stroke="#0071bf" stroke-width="3" marker-end="url(#coupling-contract-arrow-0071bf)" /><rect x="416" y="191" width="132" height="55" rx="8" fill="#ffffff" stroke="#d7e5f0" stroke-width="2"/><text x="482" y="214" font-size="15" fill="#35516b" text-anchor="middle" font-weight="400" >Quantity</text><text x="482" y="235" font-size="15" fill="#35516b" text-anchor="middle" font-weight="400" >units</text><rect x="574" y="191" width="132" height="55" rx="8" fill="#ffffff" stroke="#d7e5f0" stroke-width="2"/><text x="640" y="214" font-size="15" fill="#35516b" text-anchor="middle" font-weight="400" >Geometry</text><text x="640" y="235" font-size="15" fill="#35516b" text-anchor="middle" font-weight="400" >time</text><text x="560" y="348" font-size="19" fill="#35516b" text-anchor="middle" font-weight="400" >Declare the exchange. Validate compatibility. Execute a coordinated workflow.</text></svg>